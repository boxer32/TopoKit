# TopoKit LangChain Integration Template
# This template demonstrates how to integrate TopoKit with LangChain chains
# for building RAG systems and AI workflows

name: "langchain-integration"
description: "TopoKit integration with LangChain for RAG and chain-based workflows"
version: "1.0.0"

nodes:
  - id: "LangChain.RAG.Chain"
    kind: "ai"
    version: "1.0.0"
    scope:
      contracts: ["langchain_query"]
      context_required: true
    execution_profile:
      temperature: 0.2
      top_p: 0.9
      seed: "stable"
      max_tokens: 2000
      deterministic_reranker: true
    metadata:
      adapter: "langchain"
      chain_type: "retrieval_qa"
      llm_type: "openai"
      prompt_template: "Answer the question based on the following context:\n\n{context}\n\nQuestion: {question}\n\nAnswer:"
    slos:
      schema_pass_rate: "≥ 99%"
      drift_threshold: "≤ 10%"
      latency_budget: "≤ 3000ms"
      context_precision: "≥ 0.9"
      consistency_rate: "≥ 95%"
      cost_budget: "≤ 200 tokens/run"
    circuit_breaker:
      failure_threshold: 3
      timeout_ms: 5000
      fallback_node: null
    caching:
      enabled: true
      ttl_seconds: 3600
      key_template: "chain_hash+query_hash+context_hash"
    provenance:
      track_prompt_hash: true
      track_model_params: true
      track_retrieval_sources: true

  - id: "Vector.Store"
    kind: "data"
    version: "1.0.0"
    scope:
      contracts: ["vector_search"]
      retrieval_scope: ["vec:documents"]
      context_required: true
    execution_profile:
      temperature: 0.0
      top_p: 1.0
      seed: "stable"
      max_tokens: 1000
      deterministic_reranker: true
    metadata:
      adapter: "pinecone"
      index_name: "langchain-docs"
    slos:
      schema_pass_rate: "≥ 99%"
      drift_threshold: "≤ 5%"
      latency_budget: "≤ 1000ms"
      context_precision: "≥ 0.95"
      consistency_rate: "≥ 98%"
      cost_budget: "≤ 50 tokens/run"
    circuit_breaker:
      failure_threshold: 3
      timeout_ms: 2000
      fallback_node: null
    caching:
      enabled: true
      ttl_seconds: 7200
      key_template: "query_hash+vector_store_version"
    provenance:
      track_prompt_hash: false
      track_model_params: false
      track_retrieval_sources: true

edges:
  - id: "Vector.Store_to_LangChain.RAG.Chain"
    from: "Vector.Store"
    to: "LangChain.RAG.Chain"
    version: "1.0.0"
    contracts: ["vector_search", "langchain_query"]
    allow: true
    timeout_ms: 5000
    max_retries: 1
    circuit_breaker:
      failure_threshold: 3
      timeout_ms: 3000

contracts:
  - name: "vector_search"
    version: "1.0.0"
    input_schema:
      type: "object"
      properties:
        query:
          type: "string"
          description: "Search query"
        top_k:
          type: "number"
          default: 5
          description: "Number of results to return"
        filters:
          type: "object"
          description: "Optional metadata filters"
      required: ["query"]
    output_schema:
      type: "object"
      properties:
        documents:
          type: "array"
          items:
            type: "object"
            properties:
              content: { type: "string" }
              score: { type: "number" }
              metadata: { type: "object" }
        total_found: { type: "number" }
      required: ["documents"]

  - name: "langchain_query"
    version: "1.0.0"
    input_schema:
      type: "object"
      properties:
        question:
          type: "string"
          description: "Question to answer"
        context:
          type: "array"
          items:
            type: "object"
            properties:
              content: { type: "string" }
              score: { type: "number" }
              metadata: { type: "object" }
      required: ["question", "context"]
    output_schema:
      type: "object"
      properties:
        answer:
          type: "string"
          description: "Generated answer from LangChain"
        sources:
          type: "array"
          items: { type: "string" }
        metadata:
          type: "object"
          properties:
            chain_type: { type: "string" }
            tokens_used: { type: "number" }
            latency_ms: { type: "number" }
      required: ["answer"]

guardrails:
  determinism:
    temperature: 0.2
    seed: "session-hash"
    canonical_sort: true
  confidence:
    threshold: 0.7
    min_confidence: 0.5
  fallback:
    enabled: true
    policy: "rule_first"
  ranking:
    enabled: true
    reranker: "deterministic"
  context_alignment:
    enabled: true
    threshold: 0.8
  human_gates:
    enabled: false
    approval_required: false
  circuit_breakers:
    enabled: true
    failure_threshold: 3
  policy_engine:
    enabled: true
    environment: "development"
  observability:
    enabled: true
    logging_level: "info"
    metrics_enabled: true

context_schema:
  type: "object"
  properties:
    session_id:
      type: "string"
      description: "Unique session identifier"
    query:
      type: "string"
      description: "Original user query"
    vector_search_results:
      type: "array"
      items:
        type: "object"
        properties:
          content: { type: "string" }
          score: { type: "number" }
          metadata: { type: "object" }
    langchain_response:
      type: "object"
      properties:
        answer: { type: "string" }
        sources: { type: "array" }
        metadata: { type: "object" }
  required: ["session_id", "query"]

