edges:
  - id: UX.Intent_to_AI.Rank
    from: UX.Intent
    to: AI.Rank
    version: "1.1.0"
    contracts: [classify]
    allow: true
    timeout_ms: 4000
    max_retries: 0
    circuit_breaker:
      failure_threshold: 3
      timeout_ms: 2000
      recovery_timeout_ms: 30000
      fallback_strategy: "cached_response"

  - id: AI.Rank_to_AI.Explain
    from: AI.Rank
    to: AI.Explain
    version: "1.3.0"
    contracts: [explain]
    allow: true
    timeout_ms: 8000
    max_retries: 2
    circuit_breaker:
      failure_threshold: 4
      timeout_ms: 5000
      recovery_timeout_ms: 90000
      fallback_strategy: "template_response"
